<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="css/style.css">
    <title>Atlas Dev Days | Inscription page</title>

<body>
    <div id="header">
        <div class="logo">
            <img src="assets/atlasLogo.png" alt="Logo">
        </div>

        <div class="menu">
            <a href="accueil.html">Accueil</a>
            <a href="Programme.html">Programme</a>
            <a href="Intervenants.html">Intervenants</a>
            <button><a href="Inscription.html">Inscription</a></button>
        </div>
    </div>

    <div id="main">
        <h1>Inscription</h1>

        <div class="formInscription">
            <label for="fuulName">Nom complet</label>
            <input type="text" id="fullName" name="fullName" required minlength="3">

            <label for="mail">Email</label>
            <input type="email" id="mail" name="mail" required>

            <label for="phone">Téléphone</label>
            <input type="tel" id="phone" name="phone" required pattern="^(\+212|0)[5-7][0-9]{8}$">

            <label for="profil">profil</label>
            <select name="profil" id="profil" required>
                <option value="">Choisissez votre profil</option>
                <option value="etudiant">Étudiant·e</option>
                <option value="devloppeur">Développeur·se</option>
                <option value=" autre"> Autre</option>
            </select>

            <div class="ateliers">
                <label>Ateliers souhaités</label>

                <input type="checkbox" id="atelier1" name="atelier1" value="Nador">
                <label for="atelier1">Nador</label><br>
            </div>
        </div>
    </div>

    <div id="footer">
        <div class="list">
            <a href="errorMessage/err.html">About us</a>
            <a href="errorMessage/err.html">Contact Us</a>
            <a href="errorMessage/err.html">FAQ</a>
            <a href="errorMessage/err.html">Privacy Policy</a>
        </div>

        <div class="socialMediaIcons">
                <a href="errorMessage/err.html"><img src="assets/facebook1.png" alt="facebook logo"></a>
                <a href="errorMessage/err.html"><img src="assets/instagram1.png" alt="instagram logo"></a>
                <a href="errorMessage/err.html"><img src="assets/twitter1.png" alt="twitter logo"></a>
                <a href="errorMessage/err.html"><img src="assets/linkedin1.png" alt="linkedin logo"></a>
        </div>

        <div class="copyright">
            <p>&copy; 2026 ATLAS_DEV. All Rights Reserved.</p>
        </div>
    </div>
</body>
</html>
